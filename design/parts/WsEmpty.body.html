<div class="app" style="height:100%;position:relative">
  <div class="shell">

    <!--#include sidebar.html {"active":"new"} -->

    <div class="main">

      <!--#include topbar.html {"title":"New session"} -->

      <div class="scroll" style="display:flex;flex-direction:column;justify-content:center">
        <div class="col" style="display:flex;flex-direction:column;gap:22px;padding-top:24px;padding-bottom:24px">

          <div style="display:flex;flex-direction:column;gap:10px">
            <h1 class="h1">What do you want to build or change?</h1>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="m faint">~/projects/task-tracker</span>
              <span class="faint" aria-hidden="true">&middot;</span>
              <span class="mut" style="font-size:13px">Git repo, on main</span>
              <span class="faint" aria-hidden="true">&middot;</span>
              <span class="mut" style="font-size:13px">Vite + React detected</span>
            </div>
          </div>

          <!--#include composer.html {"placeholder":"Describe a change, or ask about this project","mode":"Build","send":"<!--#include send-arrow.html -->"} -->

          <div class="starters">
            <button type="button" data-starter="Explain how this project is organised">
              <span class="s-t">Explain how this project is organised</span>
              <span class="s-d">Reads the tree and the entry points. Changes nothing.</span>
            </button>
            <button type="button" data-starter="Fix the failing test in src/App.test.jsx">
              <span class="s-t">Fix a failing test</span>
              <span class="s-d">Runs the suite first, then edits behind a checkpoint.</span>
            </button>
            <button type="button" data-starter="Add a small feature">
              <span class="s-t">Add a small feature</span>
              <span class="s-d">Plans it, asks before installing anything.</span>
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
