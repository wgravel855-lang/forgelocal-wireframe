<div class="app" style="height:100%;position:relative">
  <div class="shell">

    <!--#include sidebar.html {"active":"models"} -->

    <div class="main">

      <!--#include topbar.html {"title":"Models"} -->

      <div class="scroll" style="overflow-y:auto">
        <div style="width:100%;max-width:960px;margin:0 auto;padding:26px 24px 32px;display:flex;flex-direction:column;gap:18px">

          <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
            <div style="flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px">
              <h1 class="h1">Models</h1>
              <p class="mut" style="margin:0;font-size:13.5px">Everything here runs on this PC unless it says otherwise.</p>
            </div>
            <label class="field" style="width:240px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink:0"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg><span class="vh">Search models</span><input type="search" data-filter-search placeholder="Search models"></label>
          </div>

          <div role="tablist" style="display:flex;gap:2px;border-bottom:1px solid var(--line-soft)">
            <button role="tab" aria-selected="true" style="padding:9px 12px;font-size:13.5px;font-weight:600;border-bottom:2px solid var(--acc);margin-bottom:-1px">Explore</button>
            <button role="tab" style="padding:9px 12px;font-size:13.5px;color:var(--mut)">My models</button>
            <button role="tab" style="padding:9px 12px;font-size:13.5px;color:var(--mut)">Downloads</button>
          </div>

          <div style="display:flex;gap:7px;flex-wrap:wrap" role="group" aria-label="Filters">
            <button class="pill" style="border-color:var(--acc);color:var(--acc-text)">Fits this PC</button>
            <button class="pill" >Coding</button>
            <button class="pill" >General</button>
            <button class="pill" >Vision</button>
            <button class="pill" >Tool use</button>
            <button class="pill" >Installed</button>
          </div>

          <ul data-filter-root style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px"><!--EXPLORE_LIST--></ul>

          <p class="faint" style="margin:0;font-size:13px;line-height:19px;max-width:70ch">
            Fit is arithmetic: quantized weights, plus the key-value cache at the stated context,
            plus runtime overhead, against this machine's video memory. Throughput is only shown
            once it has been measured here.
          </p>

        </div>
      </div>

    </div>
  </div>
</div>
