<div class="app" style="height:100%;position:relative">
  <div class="shell">

    <!--#include sidebar.html {"active":"models","mode":"normal"} -->

    <div class="main">

      <!--#include topbar.html {"title":"Downloads"} -->

      <div class="scroll" style="overflow-y:auto">
        <div class="mcol">

          <!-- The shell names the route. This page opens with the navigation,
               then one line of state, then the rows. -->
          <div class="mtabs">
            <nav class="tabline" aria-label="Model views">
              <a href="/app/models/">Explore</a>
              <a href="/app/models/installed/">My models</a>
              <span aria-current="page">Downloads</span>
            </nav>
            <details class="dl-info">
              <summary>How downloads work</summary>
              <p>One at a time, so a partial file is never left behind by a second one starting.
                Weights come from the publisher. A paused download keeps the bytes already on
                disk and resumes from there.</p>
            </details>
          </div>

          <p class="lab" data-downloads-summary><!--DOWNLOADS_SUMMARY--></p>

          <!-- Every row below is rendered from the shared model store, by the
               same function the browser re-renders with. This page owns no
               download list of its own. -->
          <div data-models-mount="downloads"><!--DOWNLOADS--></div>

        </div>
      </div>
    </div>
  </div>
</div>
