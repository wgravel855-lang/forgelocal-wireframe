<div class="app" style="height:100%;position:relative">
  <div class="shell">

    <!--#include sidebar.html {"active":"models","mode":"normal"} -->

    <div class="main">

      <!--#include topbar.html {"title":"My models"} -->

      <div class="scroll" style="overflow-y:auto">
        <div data-filter-root="mine" class="mcol">

          <!-- The shell already names the route, so this page opens with the
               navigation and the one fact the title cannot carry. -->
          <div class="mtabs">
            <nav class="tabline" aria-label="Model views">
              <a href="/app/models/">Explore</a>
              <span aria-current="page">My models</span>
              <a href="/app/models/downloads/">Downloads <span class="tabline-n" data-downloads-badge><!--DOWNLOADS_BADGE--></span></a>
            </nav>
            <label class="field msearch"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink:0"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg><span class="vh">Search models</span><input type="search" data-filter-search placeholder="Search models"></label>
          </div>

          <!-- What is downloading right now, taken from the store the Downloads
               page reads. This page keeps no copy: when that page is empty, so
               is this strip. -->
          <div data-models-mount="strip"><!--DOWNLOADS_STRIP--></div>

          <div class="mhead">
            <span class="lab" data-filter-count><!--MINE_COUNT--></span>
            <span class="grow"></span>
            <button class="btn btns" type="button" data-filter-clear hidden>Clear</button>
          </div>

          <ul class="reg" data-models-mount="installed"><!--MINE_LIST--></ul>

          <p class="chat-empty" data-filter-empty hidden style="margin:8px 0 0">
            No installed model matches that search. Clear it to see everything on disk,
            or look in <a class="link" href="/app/models/">Explore</a>.</p>

          <!-- Storage is one line under the list it describes, not a card. -->
          <p class="mut mfoot" data-mine-stats><!--MINE_TOTAL--> GB of models on disk &middot; <!--MINE_FREE--> GB free</p>

        </div>
      </div>

    </div>
  </div>
</div>
