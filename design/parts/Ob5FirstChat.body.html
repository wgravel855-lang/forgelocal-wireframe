<div class="app" style="height:100%;position:relative">
  <div class="shell">

    <!--#include sidebar.html {"active":"new","mode":"first-run"} -->

    <div class="main">

      <!--#include topbar.html {"title":"New session"} -->

      <!-- Setup 5 is the workspace, not a copy of it. The stream, composer,
           starters, menus and keyboard behaviour are the same components /app/
           renders; the only setup-specific element is the acknowledgement,
           which goes away after the first prompt or when dismissed. -->
      <div class="thread-scroll scroll" data-thread-scroll>
        <div class="thread col" data-thread data-thread-id=""></div>
      </div>

      <div class="dock">
        <div class="dock-inner col">
          <p class="setupdone" data-setup-done>
            <span class="setupdone-i" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
            <span>Setup complete. Qwen2.5 Coder 14B is loaded and balanced permissions are on.</span>
            <button class="mact" type="button" data-setup-dismiss aria-label="Dismiss setup confirmation">
              <span class="mact-i"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
            </button>
          </p>
          <!--#include composer.html {"placeholder":"Describe a change, or ask about this project","mode":"Build","send":"<!--#include send-arrow.html -->"} -->
        </div>
      </div>

      <p class="vh" role="status" aria-live="polite" data-thread-status></p>

    </div>
  </div>
</div>
