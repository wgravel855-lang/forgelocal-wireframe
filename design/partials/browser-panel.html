<!-- The browser work surface.

     Everything inside is rendered from session state by browserpanel.mjs; this
     is the frame and the controls. The panel starts hidden and the topbar
     button reveals it, so a session that never browses never sees it.

     Note what is NOT here: an address bar. The panel can go back, forward,
     reload and close, and it can resize the page. It cannot navigate to an
     arbitrary URL, because that would be a second, unpoliced way to reach an
     origin nobody approved. -->
<aside class="bpanel" data-browser-panel hidden aria-label="Browser">
  <div class="bp-hd">
    <div class="bp-title">
      <h2>Browser</h2>
      <span class="bp-iso" data-bp-iso hidden>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11V8a6 6 0 0 1 12 0v3"/><rect x="4.5" y="11" width="15" height="9" rx="2"/></svg>
        Isolated
      </span>
      <span style="flex:1"></span>
      <button class="btn btns btnq ico" type="button" data-bp-hide title="Hide the browser panel" aria-label="Hide the browser panel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="bp-nav">
      <button class="btn btns btnq ico" type="button" data-bp="back" title="Back" aria-label="Back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>
      </button>
      <button class="btn btns btnq ico" type="button" data-bp="forward" title="Forward" aria-label="Forward">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
      </button>
      <button class="btn btns btnq ico" type="button" data-bp="reload" title="Reload" aria-label="Reload">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5"/><path d="M19.5 4.5V9h-4.5"/></svg>
      </button>
      <span class="bp-loc">
        <b data-bp-title>No page</b>
        <span data-bp-url></span>
      </span>
    </div>
  </div>

  <div class="bp-body" data-bp-body></div>

  <div class="bp-ft" data-bp-ft hidden>
    <button class="btn btns" type="button" data-bp="close">Close browser</button>
    <button class="btn btns btnd" type="button" data-bp-stop hidden>Stop</button>
  </div>
</aside>
