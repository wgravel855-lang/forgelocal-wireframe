<header class="ob-top">
  <a class="btn btnq ico btns" href="{{back}}" aria-label="{{backLabel}}" title="{{backLabel}}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <a class="brand small" href="/" aria-label="ForgeLocal"><!--#include mark.html {"size":"18"} --></a>
  <span class="grow"></span>
  <!-- A count, not a labelled stepper. The bar underneath is the same fact
       drawn once more for people who read shape faster than text. -->
  <span class="ob-count" role="progressbar" aria-valuenow="{{n}}" aria-valuemin="1"
    aria-valuemax="4" aria-valuetext="Step {{n}} of 4" aria-label="Setup progress">{{n}} of 4</span>
  <div class="ob-bar" data-step="{{n}}" aria-hidden="true"><i></i></div>
</header>
