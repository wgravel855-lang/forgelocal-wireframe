<style>
  .sidebar[data-active="s1"] .srow[data-id="s1"],
  .sidebar[data-active="s2"] .srow[data-id="s2"],
  .sidebar[data-active="s3"] .srow[data-id="s3"],
  .sidebar[data-active="new"] .srow[data-id="new"],
  .sidebar[data-active="models"] .srow[data-id="models"],
  .sidebar[data-active="settings"] .srow[data-id="settings"] {
    background: var(--raised); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line);
  }
</style>
<aside class="sidebar" data-active="{{active}}" aria-label="Projects and sessions">

  <div style="height:48px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 8px 0 10px">
    <button class="btn btnq ico btns" type="button" data-sidebar-toggle aria-expanded="true" aria-label="Hide sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
    </button>
    <span class="grow"></span>
    <a class="btn btnq ico btns" href="/app/" aria-label="New session" title="New session">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.6 3.6a2.1 2.1 0 0 1 3 3L7.4 18.8 3.5 20l1.2-3.9z"/></svg>
    </a>
  </div>

  <div style="padding:0 8px 8px">
    <a class="srow" data-id="new" href="/app/" aria-label="New session" title="New session" style="height:36px;border:1px solid var(--line-strong);background:var(--raised);color:var(--fg)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="t">New session</span>
    </a>
  </div>

  <div style="padding:0 8px 10px">
    <button class="field" type="button" style="width:100%;height:36px" aria-label="Switch project" title="One example project is included in this prototype." data-inert="One example project is included in this prototype.">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.6l1.8 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);text-align:left">task-tracker</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="m6 9.5 6 6 6-6"/></svg>
    </button>
  </div>

  <nav class="scroll" style="padding:0 8px" aria-label="Recent sessions">
    <div class="sgroup">Today</div>
    <a class="srow" data-id="s1" href="/app/running/" aria-label="Persist tasks to localStorage" title="Persist tasks to localStorage">
      <span class="dot acc" aria-hidden="true"></span>
      <span class="t">Persist tasks to localStorage</span>
    </a>
    <button class="srow" type="button" data-id="s2" aria-label="Add a filter bar to the list, no screens in this prototype" title="This session has no screens in the prototype." data-inert="This session has no screens in the prototype.">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M20 6 9 17l-5-5"/></svg>
      <span class="t">Add a filter bar to the list</span>
    </button>
    <a class="srow" data-id="s3" href="/app/stopped/" aria-label="Switch the date helper to Temporal" title="Switch the date helper to Temporal">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M18 6 6 18M6 6l12 12"/></svg>
      <span class="t">Switch the date helper to Temporal</span>
    </a>

    <div class="sgroup" style="margin-top:8px">Yesterday</div>
    <button class="srow" type="button" aria-label="Scaffold the project, no screens in this prototype" title="This session has no screens in the prototype." data-inert="This session has no screens in the prototype.">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M20 6 9 17l-5-5"/></svg>
      <span class="t">Scaffold the project</span>
    </button>
    <button class="srow" type="button" aria-label="Set up Vitest, no screens in this prototype" title="This session has no screens in the prototype." data-inert="This session has no screens in the prototype.">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M20 6 9 17l-5-5"/></svg>
      <span class="t">Set up Vitest</span>
    </button>
    <button class="srow" type="button" aria-label="Show more sessions" title="Older sessions are not stored in this prototype." data-inert="Older sessions are not stored in this prototype."><span class="t faint">Show more</span></button>
  </nav>

  <div style="flex-shrink:0;border-top:1px solid var(--line-soft);padding:8px">
    <a class="srow" data-id="models" href="/app/models/" aria-label="Models" title="Models">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" style="flex-shrink:0"><rect x="3" y="3" width="18" height="18" rx="3.5"/><rect x="8" y="8" width="8" height="8" rx="1.8"/></svg>
      <span class="t">Models</span>
    </a>
    <button class="srow" type="button" aria-label="Automations, not available in this prototype" title="Automations are not built in this prototype." data-inert="Automations are not built in this prototype.">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg>
      <span class="t">Automations</span>
      <span class="lab lab-fn" data-hide-collapsed style="flex-shrink:0">soon</span>
    </button>
    <button class="srow" type="button" aria-label="Tools, not available in this prototype" title="Tool and integration settings are not built in this prototype." data-inert="Tool and integration settings are not built in this prototype.">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M14.8 6.4a4 4 0 0 1 4.8 4.8L9.6 21.2 4 22l.8-5.6z"/><path d="m3.5 3.5 5.5 5.5"/></svg>
      <span class="t">Tools</span>
      <span class="lab lab-fn" data-hide-collapsed style="flex-shrink:0">soon</span>
    </button>
    <button class="srow" type="button" data-id="settings" aria-label="Settings, not available in this prototype" title="Settings are not built in this prototype." data-inert="Settings are not built in this prototype.">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" style="flex-shrink:0"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.5"/></svg>
      <span class="t">Settings</span>
      <span class="lab lab-fn" data-hide-collapsed style="flex-shrink:0">soon</span>
    </button>
  </div>

</aside>
