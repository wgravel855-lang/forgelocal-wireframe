<aside class="sidebar" data-active="{{active}}" data-sidebar-mode="{{mode}}" aria-label="Sessions and projects">

  <!-- Brand row. The product identity and the three controls that act on the
       whole sidebar: collapse, search, new session. -->
  <div class="side-brand">
    <a class="side-mark" href="/app/" aria-label="ForgeLocal">
      <!--#include mark.html {"size":"20"} -->
      <span class="side-word" data-hide-collapsed>ForgeLocal</span>
    </a>
    <span class="grow" data-hide-collapsed></span>
    <button class="iconbtn" type="button" data-search-open aria-label="Search sessions"
      title="Search sessions" aria-haspopup="dialog" aria-expanded="false" data-hide-collapsed>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    </button>
    <a class="iconbtn" href="/app/" aria-label="New session" title="New session" data-hide-collapsed>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
    </a>
    <button class="iconbtn" type="button" data-sidebar-toggle aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
    </button>
  </div>

  <!-- New chat, collapsed only, above the project row.
       It sits here rather than with the other two rail destinations because
       starting a conversation is what this window is for; the project and the
       two model pages are things you go and manage. Its own element rather
       than a reordering of the rail, because the project row below cannot move
       into the rail: its picker is positioned against `.side-nav`. -->
  <nav class="side-chat" aria-label="New chat">
    <a class="railbtn" data-rail="/app/" href="/app/" aria-label="New chat" title="New chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
    </a>
  </nav>

  <!-- The project is a navigation row, not a card. It opens the same picker it
       always did. -->
  <div class="side-nav">
    <button class="navrow" type="button" data-popover="project-pop"
      aria-expanded="false" aria-haspopup="menu" aria-label="Switch project">
      <svg class="navrow-i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
      <span class="navrow-t" data-project-label data-hide-collapsed>task-tracker</span>
      <span class="navrow-n" data-project-count data-hide-collapsed hidden></span>
      <svg class="navrow-c" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-hide-collapsed><path d="m6 9.5 6 6 6-6"/></svg>
    </button>
    <div class="menu popover pop-project" id="project-pop" role="menu" aria-label="Projects" hidden>
      <!--PROJECT_OPTIONS-->
    </div>
  </div>

  <!-- Where the rail can go.
       Only rendered while the sidebar is collapsed. Open, the session list and
       the account row already carry all three, and repeating them would be two
       ways to reach the same page eight pixels apart. Collapsed, the rail had
       nothing but a search and a plus, so the two pages a person actually
       moves between - their own models and the one they are looking for -
       could not be reached without expanding the sidebar first. -->
  <nav class="side-rail" aria-label="Go to">
    <a class="railbtn" data-rail="/app/models/installed/" href="/app/models/installed/"
      aria-label="My Models" title="My Models">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
    </a>
    <a class="railbtn" data-rail="/app/models/" href="/app/models/"
      aria-label="Model search" title="Model search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/><circle cx="18.5" cy="18.5" r="2.5"/><path d="M20.3 20.3 22 22"/></svg>
    </a>
  </nav>

  <div class="side-sec" data-hide-collapsed>
    <span class="seclabel" id="sessions-label">Sessions</span>
    <span class="grow"></span>
    <button class="iconbtn iconbtn-sm" type="button" data-popover="filter-pop"
      aria-expanded="false" aria-haspopup="menu" aria-label="Filter sessions" title="Filter sessions">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
    </button>
    <a class="iconbtn iconbtn-sm" href="/app/" aria-label="New session" title="New session">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
    </a>
    <div class="menu popover" id="filter-pop" role="menu" aria-label="Filter sessions" hidden
      style="top:calc(100% + 4px);right:8px;width:200px;padding:6px">
      <button role="menuitemradio" aria-checked="true" class="mrow-item" type="button" data-session-filter="all">All sessions</button>
      <button role="menuitemradio" aria-checked="false" class="mrow-item" type="button" data-session-filter="needs">Needs input</button>
      <button role="menuitemradio" aria-checked="false" class="mrow-item" type="button" data-session-filter="working">Working</button>
    </div>
  </div>

  <nav class="chat-list scroll" data-hide-collapsed aria-labelledby="sessions-label">
    <!--CHAT_LIST-->
  </nav>

  <!-- One shared row menu, moved to whichever row opened it. -->
  <div class="menu popover chat-menu" id="chat-menu" role="menu" aria-label="Session actions" hidden>
    <button role="menuitem" class="mrow-item" type="button" data-chat-action="rename">Rename<span class="mrow-k">R</span></button>
    <button role="menuitem" class="mrow-item" type="button" data-chat-action="pin">Pin session<span class="mrow-k">P</span></button>
    <div class="sep"></div>
    <p class="menu-hd">Move to project</p>
    <!--MOVE_OPTIONS-->
    <div class="sep"></div>
    <button role="menuitem" class="mrow-item" type="button" data-chat-action="archive">Archive session<span class="mrow-k">A</span></button>
    <button role="menuitem" class="mrow-item is-bad" type="button" data-chat-action="delete">Delete&hellip;<span class="mrow-k">D</span></button>
  </div>

  <!-- One account row, not three unrelated navigation lines. -->
  <div class="side-acct">
    <button class="acctbtn" type="button" data-popover="profile-pop" aria-expanded="false"
      aria-haspopup="menu" aria-label="Local profile">
      <span class="acct-av" aria-hidden="true">L</span>
      <span class="acct-n" data-hide-collapsed>Local</span>
    </button>
    <span class="grow" data-hide-collapsed></span>
    <a class="iconbtn iconbtn-sm" data-id="models" href="/app/models/" aria-label="Models" title="Models" data-hide-collapsed>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3.5"/><rect x="8" y="8" width="8" height="8" rx="1.8"/></svg>
    </a>
    <a class="iconbtn iconbtn-sm" data-id="settings" href="/app/settings/" aria-label="Settings" title="Settings" data-hide-collapsed>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.5"/></svg>
    </a>
    <div class="menu popover pop-profile" id="profile-pop" role="menu" aria-label="Local profile" hidden>
      <p class="menu-hd">Local profile &middot; no account</p>
      <a role="menuitem" class="mrow-item" href="/app/settings/">Settings<span class="mrow-k">Ctrl ,</span></a>
      <button role="menuitem" class="mrow-item" type="button" data-shortcuts>Keyboard shortcuts<span class="mrow-k">?</span></button>
      <a role="menuitem" class="mrow-item" href="/app/models/">Models</a>
      <div class="sep"></div>
      <a role="menuitem" class="mrow-item" href="/docs/">Docs</a>
      <a role="menuitem" class="mrow-item" href="/changelog/">What is new</a>
    </div>
  </div>

  <!-- The session search surface. Opened from the brand row, focused on open,
       closed on Escape. It searches the same list the sidebar renders. -->
  <div class="side-find" data-search-panel hidden role="dialog" aria-modal="false" aria-label="Search sessions">
    <label class="side-find-f">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <span class="vh">Search sessions</span>
      <input type="search" data-chat-search placeholder="Search sessions" autocomplete="off">
      <button class="iconbtn iconbtn-sm" type="button" data-search-close aria-label="Close search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </label>
    <div class="side-find-r" data-search-results></div>
  </div>

  <!--SESSION_DATA-->
</aside>
