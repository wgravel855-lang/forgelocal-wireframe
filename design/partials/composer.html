<form class="composer" style="{{style}}" data-composer {{running}} aria-label="Message ForgeLocal">

  <!-- Context strip: the connection status, and nothing else. The project used
       to be repeated here as a full path chip; it is one fact, so it now lives
       only on the control that changes it, inside the composer. -->
  <div class="cstrip">
    <button class="cchip" type="button" data-popover="runtime-pop" aria-expanded="false"
      aria-haspopup="dialog" aria-label="Runtime status">
      <span data-env-label><!--RUNTIME_LABEL--></span>
    </button>
  </div>

  <div class="queue" data-queue hidden aria-label="Queued messages"></div>

  <!-- The input and its controls are one object, at one size, in every state:
       an empty chat, a chat with messages, a running turn and a stopped one.
       Nothing here resizes with conversation state. -->
  <div class="cshell">
  <!-- Attached files, above the input they belong to. -->
  <div class="catt" data-attachments hidden aria-label="Attached files"></div>

  <!-- Send sits on the message row, beside the field it sends, which is where
       it was before the composer became one geometry. It stays pinned to the
       first line so a growing draft never moves it. -->
  <div class="cinput">
    <label class="vh" for="composer-input">Describe a task or ask a question</label>
    <textarea id="composer-input" class="ta" rows="1" placeholder="{{placeholder}}"></textarea>
    {{send}}
  </div>

  <div class="cbar">
    <!-- Left: attach, then what the agent is allowed to do. -->
    <div class="cbar-l">
      <!-- The plus opens the file picker directly. It used to open a popover
           listing two things it could not do. -->
      <button class="btn btnq ico btns" type="button" data-attach
        aria-label="Attach files" title="Attach files">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
      </button>
      <input class="vh" type="file" multiple data-attach-input tabindex="-1" aria-hidden="true">

      <div style="position:relative">
        <button class="btn btnq btns" type="button" data-popover="mode-pop" aria-expanded="false" aria-haspopup="menu">
          <span data-mode-label>{{mode}}</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>
        </button>
        <!-- Rendered from core/modes.mjs, so the menu and the label can never
             disagree about which modes exist. -->
        <div class="menu popover" id="mode-pop" role="menu" hidden data-mode-pop
          style="bottom:calc(100% + 8px);left:0;width:320px;padding:6px"><!--MODE_MENU--></div>
      </div>
    </div>

    <span class="grow"></span>

    <!-- Right: which project, which model, how hard it thinks, and send. -->
    <div class="cbar-r">
      <!-- Opens the browser's own directory chooser. The label is the folder's
           name; the title carries whatever fuller path is actually known. -->
      <button class="btn btnq btns projbtn" type="button" data-project-choose data-empty="true"
        aria-label="Choose project folder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.6l1.8 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span data-project-name>Choose project</span>
      </button>
      <input class="vh" type="file" webkitdirectory directory data-project-input tabindex="-1" aria-hidden="true">

      <div style="position:relative">
        <button class="btn btnq btns" type="button" data-popover="model-pop" aria-expanded="false"
          aria-haspopup="menu" aria-keyshortcuts="Control+L">
          <span data-model-label><!--MODEL_LABEL--></span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>
        </button>
        <div class="menu popover mpick" id="model-pop" role="menu" aria-label="Choose a model"
          hidden style="bottom:calc(100% + 8px);top:auto;right:0;left:auto"
          data-models-mount="picker"><!--MODEL_PICKER--></div>
      </div>

      <div style="position:relative">
        <button class="btn btnq btns" type="button" data-popover="effort-pop" aria-expanded="false" aria-haspopup="menu">
          <span data-effort-label>Standard</span>
        </button>
        <div class="menu popover" id="effort-pop" role="menu" hidden
          style="bottom:calc(100% + 8px);right:0;left:auto;width:260px;padding:6px">
          <button role="menuitemradio" aria-checked="false" class="srow mrow" type="button" data-effort="Quick">
            <span class="mrow-t">Quick</span><span class="mrow-d">Fewer steps, faster answers.</span>
          </button>
          <button role="menuitemradio" aria-checked="true" class="srow mrow on" type="button" data-effort="Standard">
            <span class="mrow-t">Standard</span><span class="mrow-d">The default balance.</span>
          </button>
          <button role="menuitemradio" aria-checked="false" class="srow mrow" type="button" data-effort="Thorough">
            <span class="mrow-t">Thorough</span><span class="mrow-d">Reads more before acting.</span>
          </button>
        </div>
      </div>

      <!-- A percentage is a fraction of a real model's window. With nothing
           loaded there is no denominator, so the whole control is absent: an
           em dash on a clickable button is a puzzle, not a status. -->
      <div style="position:relative" data-ctx-wrap hidden>
        <button class="btn btnq btns cbar-ctx" type="button" data-popover="opts-pop"
          aria-expanded="false" aria-haspopup="dialog" data-ctx-btn aria-label="Context usage">
          <span class="ring" data-ctx-ring style="--pct:0" aria-hidden="true"></span>
          <span class="num" data-ctx-pct></span>
        </button>
        <div class="menu popover pdetails" id="opts-pop" role="dialog" aria-label="Context usage"
          hidden data-ctx-pop
          style="bottom:calc(100% + 8px);top:auto;right:0;left:auto;width:320px"></div>
      </div>
    </div>
  </div>
  </div>

  <!-- Real stored sessions only, and only in the start composition. Filled by
       the controller from the same payload the sidebar reads. -->
  <nav class="recents" data-recents hidden aria-label="Recent sessions"></nav>
</form>
