<form class="composer" style="{{style}}" data-composer {{running}} aria-label="Message ForgeLocal">

  <!-- Context strip: where the work happens and what it can reach. These are
       facts about the session, so they sit above the input rather than
       competing with the controls that change what happens next. -->
  <div class="cstrip">
    <button class="cchip" type="button" data-popover="runtime-pop" aria-expanded="false"
      aria-haspopup="dialog" aria-label="Runtime status">
      <span data-env-label><!--RUNTIME_LABEL--></span>
    </button>
    <button class="cchip" type="button" data-popover="folder-pop" aria-expanded="false"
      aria-haspopup="dialog" aria-label="Project folder">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.6l1.8 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="m" data-folder-label>~/projects/task-tracker</span>
    </button>
    <div class="folder-anchor">
      <div class="menu popover pdetails" id="folder-pop" role="dialog" aria-label="Project folder" hidden>
        <dl class="pd-kv">
          <dt>Root</dt><dd><span class="m" data-pd-path>~/projects/task-tracker</span></dd>
          <dt>Repository</dt><dd><span data-pd-branch>Git repo, on main</span></dd>
          <dt>Stack</dt><dd><span data-pd-stack>Vite + React detected</span></dd>
          <dt>Access</dt><dd>Files under this root. Anything outside asks first.</dd>
        </dl>
        <div class="sep"></div>
        <div class="pd-a">
          <button class="btn btns" type="button" data-open-folder>Show in Explorer</button>
          <a class="btn btns" href="/app/settings/#permissions">Permissions</a>
        </div>
        <p class="pd-note">Choosing a different folder needs the desktop app.</p>
      </div>
    </div>
  </div>

  <div class="queue" data-queue hidden aria-label="Queued messages"></div>

  <!-- Only the input is a surface. The strip above and the rail below sit on
       the canvas, so the group reads as a text field with its context, not as
       one large card. -->
  <div class="cinput">
    <label class="vh" for="composer-input">Describe a task or ask a question</label>
    <textarea id="composer-input" class="ta" rows="1" placeholder="{{placeholder}}"></textarea>
  </div>

  <div class="cbar">
    <!-- Left: what the agent is allowed to do, and what it can see. -->
    <div class="cbar-l">
      <div style="position:relative">
        <button class="btn btnq btns" type="button" data-popover="mode-pop" aria-expanded="false" aria-haspopup="menu">
          <span data-mode-label>{{mode}}</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>
        </button>
        <!-- Rendered from core/modes.mjs, so the menu and the label can never
             disagree about which modes exist. -->
        <div class="menu popover" id="mode-pop" role="menu" hidden data-mode-pop
          style="bottom:calc(100% + 8px);left:0;width:320px;padding:6px"><!--MODE_MENU--></div>
      </div>

      <div style="position:relative">
        <button class="btn btnq ico btns" type="button" data-popover="ctx-pop" aria-expanded="false"
          aria-haspopup="dialog" aria-label="Add context">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
        </button>
        <div class="menu popover pdetails" id="ctx-pop" role="dialog" aria-label="Add context"
          hidden style="bottom:calc(100% + 8px);top:auto;left:0;width:300px">
          <p class="pd-h">Add to this task</p>
          <div class="pd-a" style="flex-direction:column;align-items:stretch;gap:4px">
            <button class="srow" type="button" data-inert="Attaching a specific file needs the desktop app."><span class="t">A file from the project</span></button>
            <button class="srow" type="button" data-inert="Attaching an image needs the desktop app."><span class="t">An image or screenshot</span></button>
          </div>
          <p class="pd-note">Type <span class="m">@</span> in the composer to reference a path.</p>
        </div>
      </div>
    </div>

    <span class="grow"></span>

    <!-- Right: which model, how hard it thinks, how much room is left. -->
    <div class="cbar-r">
      <div style="position:relative">
        <button class="btn btnq btns" type="button" data-popover="model-pop" aria-expanded="false"
          aria-haspopup="menu" aria-keyshortcuts="Control+L">
          <span data-model-label><!--MODEL_LABEL--></span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>
        </button>
        <div class="menu popover mpick" id="model-pop" role="menu" aria-label="Choose a model"
          hidden style="bottom:calc(100% + 8px);top:auto;right:0;left:auto"
          data-models-mount="picker"><!--MODEL_PICKER--></div>
      </div>

      <div style="position:relative">
        <button class="btn btnq btns" type="button" data-popover="effort-pop" aria-expanded="false" aria-haspopup="menu">
          <span data-effort-label>Standard</span>
        </button>
        <div class="menu popover" id="effort-pop" role="menu" hidden
          style="bottom:calc(100% + 8px);right:0;left:auto;width:260px;padding:6px">
          <button role="menuitemradio" aria-checked="false" class="srow mrow" type="button" data-effort="Quick">
            <span class="mrow-t">Quick</span><span class="mrow-d">Fewer steps, faster answers.</span>
          </button>
          <button role="menuitemradio" aria-checked="true" class="srow mrow on" type="button" data-effort="Standard">
            <span class="mrow-t">Standard</span><span class="mrow-d">The default balance.</span>
          </button>
          <button role="menuitemradio" aria-checked="false" class="srow mrow" type="button" data-effort="Thorough">
            <span class="mrow-t">Thorough</span><span class="mrow-d">Reads more before acting.</span>
          </button>
        </div>
      </div>

      <div style="position:relative">
        <!-- A percentage is a fraction of a real model's window. With nothing
             loaded there is no denominator, so the control shows an em dash
             rather than the 34% it used to keep. -->
        <button class="btn btnq btns cbar-ctx" type="button" data-popover="opts-pop"
          aria-expanded="false" aria-haspopup="dialog" data-ctx-btn aria-label="Context usage">
          <span class="ring" data-ctx-ring style="--pct:0" aria-hidden="true" hidden></span>
          <span class="num" data-ctx-pct>&mdash;</span>
        </button>
        <div class="menu popover pdetails" id="opts-pop" role="dialog" aria-label="Context usage"
          hidden data-ctx-pop
          style="bottom:calc(100% + 8px);top:auto;right:0;left:auto;width:320px"></div>
      </div>

      {{send}}
    </div>
  </div>
</form>
