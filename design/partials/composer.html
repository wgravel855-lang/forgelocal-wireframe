<form class="composer" style="{{style}}" data-composer {{running}} aria-label="Message ForgeLocal">
  <label class="vh" for="composer-input">Describe a change or ask a question</label>
  <textarea id="composer-input" class="ta" rows="1" placeholder="{{placeholder}}"></textarea>

  <div class="cbar">
    <button class="btn btnq ico btns" type="button" aria-label="Attach a file or add context"
      data-inert="Attachments are not implemented in this prototype.">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
    </button>

    <div style="position:relative">
      <button class="btn btnq btns" type="button" data-popover="model-pop" aria-expanded="false" aria-haspopup="menu">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3.5"/><rect x="8" y="8" width="8" height="8" rx="1.8"/></svg>
        <span data-model-label>Qwen2.5 Coder 14B</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>
      </button>
      <!--MODEL_PICKER-->
    </div>

    <div style="position:relative">
      <button class="btn btnq btns" type="button" data-popover="mode-pop" aria-expanded="false" aria-haspopup="menu">
        <span data-mode-label>{{mode}}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>
      </button>
      <div class="menu popover" id="mode-pop" role="menu" hidden
        style="bottom:calc(100% + 8px);left:0;width:300px;padding:6px">
        <button role="menuitemradio" aria-checked="false" class="srow" data-mode="Ask" style="height:auto;padding:9px;align-items:flex-start">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:13.5px;font-weight:600">Ask</span>
            <span class="faint" style="font-size:13px;line-height:17px">Answers questions and reads files. Changes nothing.</span>
          </span>
        </button>
        <button role="menuitemradio" aria-checked="false" class="srow" data-mode="Plan" style="height:auto;padding:9px;align-items:flex-start">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:13.5px;font-weight:600">Plan</span>
            <span class="faint" style="font-size:13px;line-height:17px">Writes a plan for you to approve before anything runs.</span>
          </span>
        </button>
        <button role="menuitemradio" aria-checked="true" class="srow on" data-mode="Build" style="height:auto;padding:9px;align-items:flex-start">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:13.5px;font-weight:600">Build</span>
            <span class="faint" style="font-size:13px;line-height:17px">Edits files and runs the project's own commands, asking per your permission preset.</span>
          </span>
        </button>
      </div>
    </div>

    <div style="position:relative">
      <button class="btn btnq ico btns" type="button" data-popover="opts-pop" aria-expanded="false"
        aria-haspopup="menu" aria-label="More options">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <div class="menu popover" id="opts-pop" role="menu" hidden
        style="bottom:calc(100% + 8px);left:0;width:300px;padding:10px 12px">
        <div class="stack" style="gap:12px">
          <div class="stack" style="gap:5px">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="lab" style="flex:1">Context used</span>
              <span class="m num">34%</span>
            </div>
            <div class="track"><div class="fillbar" style="width:34%"></div></div>
            <span class="faint" style="font-size:13px">5.6k of 16k tokens. You are warned before it becomes a problem.</span>
          </div>
          <div class="sep"></div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="flex:1;font-size:13px">Permission preset</span>
            <span class="pill">Balanced</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="flex:1;font-size:13px">Reasoning effort</span>
            <span class="pill">High</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="flex:1;font-size:13px">Runs on</span>
            <span class="pill ok">This device</span>
          </div>
        </div>
      </div>
    </div>

    <span class="grow"></span>

    {{send}}
  </div>
</form>
