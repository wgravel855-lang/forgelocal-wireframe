<header class="topbar">
  <button class="iconbtn" type="button" data-sidebar-toggle aria-expanded="true" aria-label="Show sidebar" title="Show sidebar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
  </button>

  <!-- Breadcrumbs: where this session lives, and what it is. Each half opens
       the selector it already had; the header used to be nearly empty and said
       neither. -->
  <nav class="crumbs" aria-label="Location">
    <button class="crumb crumb-proj" type="button" data-popover="project-details"
      aria-expanded="false" aria-haspopup="dialog" aria-label="Project details">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2 2 0 0 1 5 5.5h3.6l1.8 2H19a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-pd-name>task-tracker</span>
    </button>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <h1 class="crumb crumb-title ws-h1" data-ws-title>{{title}}</h1>

    <div class="menu popover pdetails" id="project-details" role="dialog" aria-label="Project and session details" hidden>
      <dl class="pd-kv">
        <dt>Project</dt><dd><span data-pd-name>task-tracker</span></dd>
        <dt>Root</dt><dd><span class="m" data-pd-path>~/projects/task-tracker</span></dd>
        <dt>Repository</dt><dd><span data-pd-branch>Git repo, on main</span></dd>
        <dt>Stack</dt><dd><span data-pd-stack>Vite + React detected</span></dd>
        <dt>Model</dt><dd><span data-pd-model>No model loaded</span></dd>
        <dt>Permissions</dt><dd><span data-preset-label>Ask before changes</span></dd>
      </dl>
      <div class="sep"></div>
      <div class="pd-a">
        <button class="btn btns" type="button" data-open-folder>Open folder</button>
        <a class="btn btns" href="/app/settings/">Project settings</a>
      </div>
    </div>
  </nav>

  {{status}}

  <div style="position:relative">
    <button class="pill hide-sm" type="button" data-popover="runtime-pop" data-runtime-pill hidden
      aria-expanded="false" aria-haspopup="dialog" aria-label="Runtime status">
      <span class="dot warn" aria-hidden="true"></span><span data-runtime-word>Runtime</span>
    </button>
    <!-- Rendered from core/runtime.mjs. There is no markup here for a version,
         a device or a memory figure, so none can be printed without a real
         handshake having supplied it. -->
    <div class="menu popover pdetails" id="runtime-pop" role="dialog" aria-label="Local runtime"
      hidden data-runtime-pop></div>
  </div>

  {{artifacts}}

  <!-- The work pane toggle. It reflects a pane this build actually has. -->
  <button class="iconbtn" type="button" data-pane-toggle aria-expanded="false"
    aria-label="Show work pane" title="Work pane">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg>
  </button>

  <div style="position:relative">
    <button class="iconbtn" type="button" data-popover="more-pop" aria-expanded="false"
      aria-haspopup="menu" aria-label="More options" title="More">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="19" cy="12" r=".9"/></svg>
    </button>
    <div class="menu popover" id="more-pop" role="menu" aria-label="More" hidden
      style="top:calc(100% + 6px);right:0;width:238px;padding:6px">
      <button role="menuitem" class="mrow-item" type="button" data-chat-action="rename">Rename&hellip;<span class="mrow-k">R</span></button>
      <button role="menuitem" class="mrow-item" type="button" data-chat-action="pin">Pin session<span class="mrow-k">P</span></button>
      <div class="sep"></div>
      <button role="menuitem" class="mrow-item" type="button" data-shortcuts>Keyboard shortcuts<span class="mrow-k">?</span></button>
      <a role="menuitem" class="mrow-item" href="/app/settings/">Settings<span class="mrow-k">Ctrl ,</span></a>
      <a role="menuitem" class="mrow-item" href="/docs/">Docs</a>
    </div>
  </div>
</header>
