<header class="topbar">
  <button class="btn btnq ico btns" type="button" data-sidebar-toggle aria-expanded="true" aria-label="Hide sidebar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
  </button>

  <!-- The chevron now opens something. Project, model, permission preset,
       context and checkpoint are the five things a user asks about mid-task. -->
  <div style="position:relative;min-width:0">
    <button class="hit" style="gap:7px;padding:0 8px;border-radius:7px;min-width:0"
      data-popover="project-details" aria-expanded="false" aria-haspopup="dialog"
      aria-label="Project and session details">
      <h1 class="ws-h1" data-ws-title>{{title}}</h1>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="m6 9.5 6 6 6-6"/></svg>
    </button>
    <div class="menu popover pdetails" id="project-details" role="dialog" aria-label="Project and session details" hidden>
      <dl class="pd-kv">
        <dt>Project</dt><dd><span data-pd-name>task-tracker</span></dd>
        <dt>Root</dt><dd><span class="m" data-pd-path>~/projects/task-tracker</span></dd>
        <dt>Repository</dt><dd><span data-pd-branch>Git repo, on main</span></dd>
        <dt>Stack</dt><dd><span data-pd-stack>Vite + React detected</span></dd>
        <dt>Model</dt><dd><span data-pd-model>Qwen2.5 Coder 14B</span> <span class="faint">Q4_K_M</span></dd>
        <dt>Permissions</dt><dd><span data-preset-label>Balanced</span></dd>
        <dt>Context used</dt><dd><span class="num">5.6k of 16k</span> <span class="faint">34%</span></dd>
        <dt>Checkpoint</dt><dd>Checkpoint 4, before the last edit</dd>
      </dl>
      <div class="sep"></div>
      <div class="pd-a">
        <button class="btn btns" type="button" data-open-folder>Open folder</button>
        <a class="btn btns" href="/app/settings/">Project settings</a>
      </div>
    </div>
  </div>

  <span class="grow"></span>

  {{status}}

  <div style="position:relative">
    <button class="pill hide-sm" type="button" data-popover="runtime-pop" data-runtime-pill hidden
      aria-expanded="false" aria-haspopup="dialog" aria-label="Runtime status">
      <span class="dot warn" aria-hidden="true"></span><span data-runtime-word>Runtime</span>
    </button>
    <!-- Rendered from core/runtime.mjs. There is no markup here for a version,
         a device or a memory figure, so none can be printed without a real
         handshake having supplied it. -->
    <div class="menu popover pdetails" id="runtime-pop" role="dialog" aria-label="Local runtime"
      hidden data-runtime-pop></div>
  </div>

  {{artifacts}}

  <div style="position:relative">
    <button class="btn btnq ico btns" type="button" data-popover="more-pop" aria-expanded="false"
      aria-haspopup="menu" aria-label="More options">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r=".8"/><circle cx="12" cy="12" r=".8"/><circle cx="19" cy="12" r=".8"/></svg>
    </button>
    <div class="menu popover" id="more-pop" role="menu" aria-label="More" hidden
      style="top:calc(100% + 6px);right:0;width:236px;padding:6px">
      <button role="menuitem" class="srow" type="button" data-shortcuts>
        <span class="t">Keyboard shortcuts</span><span class="lab">?</span></button>
      <a role="menuitem" class="srow" href="/app/settings/"><span class="t">Settings</span></a>
      <a role="menuitem" class="srow" href="/docs/"><span class="t">Docs</span></a>
    </div>
  </div>
</header>
